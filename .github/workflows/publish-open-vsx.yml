name: Publish Extension

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Package extension (VSIX)
        run: npx -y @vscode/vsce package --no-dependencies
      - name: Publish to Visual Studio Marketplace
        run: npx -y @vscode/vsce publish --packagePath *.vsix -p ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx -y ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }} --skip-duplicate
        continue-on-error: true
